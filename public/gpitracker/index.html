<!DOCTYPE html>

<title>GPI GUIDE · Vanguard</title>
<link rel="manifest" href="/gpitracker/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GPI GUIDE">
<link rel="apple-touch-icon" href="/gpitracker/icon.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root, [data-theme="dark"] {
  --bg: #0b1320; --bg-2: #111c2e; --panel: #15223a; --panel-2: #1b2c4a;
  --line: #243a5e; --text: #e7eef9; --muted: #8aa0c2;
  --accent: #d4b06a; --accent-2: #f0c987; --accent-text: #0b1320;
  --green:#22c55e; --red:#ef4444; --blue:#3b82f6; --purple:#a855f7; --orange:#f59e0b; --teal:#14b8a6; --pink:#ec4899;
  --shadow: 0 10px 40px rgba(0,0,0,.35);
  --bg-grad-1: radial-gradient(1200px 600px at 10% -10%, #1c2a4a 0%, transparent 60%),
                radial-gradient(900px 500px at 110% 110%, #1d3056 0%, transparent 50%);
  --chart-grid: rgba(138,160,194,.1);
  --chart-tick: #8aa0c2;
}
[data-theme="light"] {
  --bg: #f4f6fa; --bg-2: #ffffff; --panel: #ffffff; --panel-2: #f7f9fc;
  --line: #e5e9f0; --text: #0f1d34; --muted: #6b7a92;
  --accent: #b8923a; --accent-2: #d4b06a; --accent-text: #ffffff;
  --shadow: 0 8px 30px rgba(15,29,52,.08);
  --bg-grad-1: radial-gradient(900px 500px at -10% -20%, #fef0d4 0%, transparent 60%),
                radial-gradient(900px 600px at 120% 110%, #e5e9f0 0%, transparent 50%);
  --chart-grid: rgba(107,122,146,.15);
  --chart-tick: #6b7a92;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, system-ui, sans-serif;
  background: var(--bg-grad-1), var(--bg);
  color: var(--text);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  transition: background .25s, color .25s;
}
button { font-family: inherit; }
a { color: var(--accent-2); }
input, select, textarea { font-family: inherit; }

.layout { display: flex; min-height: 100vh; }
.sidebar {
  width: 260px; flex-shrink: 0;
  background: linear-gradient(180deg, var(--panel) 0%, var(--bg-2) 100%);
  border-right: 1px solid var(--line);
  padding: 20px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
  display: flex; flex-direction: column;
}
.brand { display:flex; align-items:center; gap:10px; padding: 6px 8px 18px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.brand .logo {
  width: 40px; height: 40px; border-radius: 11px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
  color: var(--accent-text); font-weight: 800; display:flex; align-items:center; justify-content:center;
  font-size: 12px; box-shadow: 0 6px 14px rgba(212,176,106,.3); letter-spacing: -.5px;
}
.brand .title { font-weight: 800; letter-spacing: 1px; font-size: 15px; }
.brand .subtitle { font-size: 11px; color: var(--muted); margin-top:1px; }
.nav { display:flex; flex-direction:column; gap: 4px; flex: 1; }
.nav button {
  display:flex; align-items:center; gap:11px; background:transparent; border:0;
  color: var(--muted); padding: 11px 12px; border-radius: 10px;
  text-align: left; font-size: 14px; font-weight: 500; cursor: pointer; width:100%;
  transition: all .15s ease;
}
.nav button:hover { background: var(--panel-2); color: var(--text); }
.nav button.active {
  background: linear-gradient(90deg, rgba(212,176,106,.12) 0%, rgba(212,176,106,0) 80%);
  color: var(--accent-2); border-left: 3px solid var(--accent); padding-left: 9px;
}
.nav button[disabled] { opacity:.4; cursor: not-allowed; }
.btn-install { 
  margin: 12px; padding: 12px; background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: var(--accent-text); border: none; border-radius: 12px; font-weight: 700; font-size: 13px;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 4px 15px rgba(212, 176, 106, 0.3); transition: all 0.2s ease;
}
.btn-install:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(212, 176, 106, 0.4); }
.btn-install:active { transform: scale(0.98); }

/* Funnel Styles */
.funnel-container { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 20px 0; }
.funnel-stage {
  width: 100%; max-width: 400px; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--panel-2); display: flex; align-items: center; justify-content: space-between;
  position: relative; transition: all 0.2s;
}
.funnel-stage:hover { border-color: var(--accent); background: var(--panel); }
.funnel-stage .info { flex: 1; }
.funnel-stage .name { font-size: 13px; font-weight: 600; color: var(--muted); }
.funnel-stage .count { font-size: 20px; font-weight: 800; }
.funnel-stage .actions { display: flex; gap: 4px; }
.funnel-conversion {
  height: 30px; display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: var(--accent); position: relative; width: 100%;
}
.funnel-conversion::before, .funnel-conversion::after {
  content: ''; position: absolute; height: 10px; width: 1px; background: var(--line); left: 50%;
}
.funnel-conversion::before { top: 0; }
.funnel-conversion::after { bottom: 0; }
.funnel-conv-label { background: var(--bg); padding: 2px 8px; border-radius: 10px; border: 1px solid var(--line); z-index: 1; }

.sidebar-footer { padding: 12px 8px; border-top: 1px solid var(--line); display:flex; gap: 8px; align-items:center; }
.sidebar-footer .user-avatar {
  width: 34px; height: 34px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
  color: var(--accent-text); display:flex; align-items:center; justify-content: center;
  font-weight: 700; font-size: 13px;
}
.sidebar-footer .user-info { flex: 1; min-width: 0; }
.sidebar-footer .user-info .name { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sidebar-footer .user-info .role { font-size: 11px; color: var(--muted); }

.main { flex: 1; padding: 24px 28px 80px; max-width: calc(100vw - 260px); }
.topbar {
  display:flex; align-items:center; justify-content: space-between; gap: 10px;
  padding: 14px 16px; background: var(--bg-2); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 50;
}
.topbar.mobile { display: none; }
.topbar .icon-btn {
  background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
  width: 38px; height: 38px; border-radius: 10px; cursor: pointer; display:flex; align-items:center; justify-content:center;
}
.topbar .icon-btn:hover { background: var(--panel); border-color: var(--accent); }

@media (max-width: 900px) {
  .sidebar {
    position: fixed; left: 0; top: 0; width: 280px;
    transform: translateX(-100%); transition: transform .25s ease;
    z-index: 100; height: 100vh; box-shadow: var(--shadow);
  }
  .sidebar.open { transform: translateX(0); }
  .main { max-width: 100vw; padding: 14px 12px 110px; }
  .topbar.mobile { display: flex; }
  .topbar.desktop { display: none; }
  .scrim { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index: 90; }
  .scrim.show { display:block; }
  .layout { padding-bottom: 70px; }
}

/* BOTTOM NAV (mobile) */
.bottom-nav {
  display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 60;
  background: var(--bg-2); border-top: 1px solid var(--line);
  padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
  justify-content: space-around;
}
.bottom-nav button {
  background: transparent; border: 0; color: var(--muted); cursor: pointer;
  display:flex; flex-direction: column; align-items:center; gap: 2px;
  padding: 8px 12px; border-radius: 10px; font-size: 11px; font-weight: 600;
  flex: 1; transition: color .15s;
}
.bottom-nav button.active { color: var(--accent-2); }
.bottom-nav button .ico { font-size: 22px; line-height: 1; }
.bottom-nav button { position: relative; }
.bnav-badge, .nav-badge {
  display:inline-flex; align-items:center; justify-content:center;
  min-width: 18px; height: 18px; padding: 0 5px;
  font-size: 10px; font-weight: 800; border-radius: 9px;
  background: var(--danger, #ef4444); color: #fff; line-height: 1;
}
.bnav-badge { position: absolute; top: 4px; right: 14px; }
.nav-badge  { margin-left: 8px; }
@media (max-width: 900px) { .bottom-nav { display: flex; } }

/* TYPO */
h1, h2, h3 { margin: 0; }
h1 { font-size: 24px; font-weight: 800; letter-spacing: -.4px; }
h2 { font-size: 18px; font-weight: 700; }
h3 { font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
.page-head { display:flex; align-items: end; justify-content: space-between; gap:14px; margin-bottom: 18px; flex-wrap: wrap; }
.page-head p { color: var(--muted); margin: 4px 0 0; font-size: 13px; }

/* CARDS */
.card {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 16px; padding: 18px; box-shadow: var(--shadow);
}
.card-title { font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; margin-bottom:14px; display:flex; align-items: center; justify-content: space-between; gap: 8px; }
.card-title .pill { font-size: 11px; padding: 3px 10px; background: var(--panel-2); color: var(--accent-2); border-radius: 999px; text-transform: none; letter-spacing:0; font-weight: 600; }

/* GRID */
.grid { display:grid; gap: 14px; }
.grid-kpis { grid-template-columns: repeat(4, minmax(0,1fr)); }
.grid-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
@media (max-width: 1100px) { .grid-kpis, .grid-3 { grid-template-columns: repeat(2, 1fr); } .grid-2 { grid-template-columns: 1fr; } }
@media (max-width: 600px) { .grid-kpis { grid-template-columns: 1fr 1fr; gap: 10px; } .grid-3 { grid-template-columns: 1fr; } .grid { gap: 10px; } .card { padding: 14px; } h1 { font-size: 20px; }}

/* KPI */
.kpi { display:flex; flex-direction: column; gap: 4px; }
.kpi .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
.kpi .value { font-size: 26px; font-weight: 800; letter-spacing: -.5px; line-height:1.1; }
.kpi .delta { font-size: 11px; color: var(--green); font-weight: 600; }
.kpi .icon {
  width: 38px; height: 38px; border-radius: 11px; display:flex; align-items:center; justify-content:center;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%); color: var(--accent-text); font-size: 18px;
}
.kpi-row { display:flex; align-items: center; justify-content: space-between; gap:8px; }
@media (max-width: 600px) {
  .kpi .value { font-size: 22px; }
  .kpi .icon { width: 32px; height: 32px; font-size: 15px; }
}

/* FORM */
.form { display:grid; gap: 12px; }
.form-row { display:grid; gap: 12px; grid-template-columns: repeat(2, 1fr); }
@media (max-width: 700px) { .form-row { grid-template-columns: 1fr; } }
label { display:block; font-size: 11px; color: var(--muted); margin-bottom: 5px; font-weight:700; text-transform: uppercase; letter-spacing: .5px; }
input, select, textarea {
  width: 100%; padding: 11px 13px; border-radius: 10px; border:1px solid var(--line);
  background: var(--bg-2); color: var(--text); font-size: 14px;
  transition: border-color .15s, box-shadow .15s;
}
input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(212,176,106,.2);
}
textarea { resize: vertical; min-height: 65px; }

/* BUTTON */
.btn {
  display:inline-flex; align-items:center; gap: 8px; padding: 10px 16px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer;
  font-size: 14px; font-weight: 600; transition: all .15s; text-decoration: none;
  white-space: nowrap;
}
.btn:hover { background: var(--panel-2); border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
  color: var(--accent-text); border: 0; font-weight: 700;
}
.btn.primary:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(212,176,106,.35); }
.btn.danger { background: rgba(239,68,68,.15); color: #fecaca; border-color: rgba(239,68,68,.4); }
[data-theme="light"] .btn.danger { color: #b91c1c; }
.btn.danger:hover { background: rgba(239,68,68,.25); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 6px 12px; font-size: 12px; }
.btn.block { width: 100%; justify-content: center; }
.btn.giant {
  width: 100%; padding: 26px; font-size: 20px; border-radius: 18px;
  box-shadow: 0 10px 30px rgba(0,0,0,.3);
}

/* TABLE */
.table-wrap { overflow-x: auto; border-radius: 12px; border:1px solid var(--line); -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; min-width: 760px; }
thead { background: var(--panel-2); }
th, td { padding: 11px 13px; text-align: left; font-size: 13px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .5px; font-size: 10px; }
tbody tr:hover { background: var(--panel-2); }
tbody tr:last-child td { border-bottom: 0; }
.badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; }
.badge.green { background: rgba(34,197,94,.15); color: #16a34a; }
.badge.gold { background: rgba(212,176,106,.18); color: #b8923a; }
.badge.blue { background: rgba(59,130,246,.15); color: #2563eb; }
.badge.purple { background: rgba(168,85,247,.15); color: #9333ea; }
.badge.orange { background: rgba(245,158,11,.18); color: #b45309; }
.badge.red { background: rgba(239,68,68,.15); color: #b91c1c; }
.badge.gray { background: rgba(138,160,194,.15); color: var(--muted); }
[data-theme="dark"] .badge.green { color: #86efac; }
[data-theme="dark"] .badge.gold { color: var(--accent-2); }
[data-theme="dark"] .badge.blue { color: #93c5fd; }
[data-theme="dark"] .badge.purple { color: #d8b4fe; }
[data-theme="dark"] .badge.orange { color: #fde68a; }
[data-theme="dark"] .badge.red { color: #fecaca; }

/* TOOLBAR */
.toolbar { display:flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
.toolbar input, .toolbar select { padding: 9px 12px; min-width: 130px; font-size: 13px; }
.toolbar .spacer { flex: 1; }
@media (max-width: 600px) {
  .toolbar input, .toolbar select { width: 100%; min-width: 0; }
  .toolbar { gap: 6px; }
}

/* MODAL */
.modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(4px);
  display:none; align-items:center; justify-content:center; padding: 20px; z-index: 200;
}
.modal-bg.open { display:flex; }
.modal {
  background: var(--bg-2); border:1px solid var(--line); border-radius: 18px; padding: 22px;
  width: 100%; max-width: 720px; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow);
}
.modal h2 { margin-bottom: 16px; }
.modal .close { float: right; background: none; border: 0; color: var(--muted); font-size: 24px; cursor: pointer; line-height: 1; }
.modal .close:hover { color: var(--text); }

/* TOAST */
.toast-stack { position: fixed; bottom: 90px; right: 20px; z-index: 300; display:flex; flex-direction: column; gap: 10px; }
@media (max-width: 900px) { .toast-stack { bottom: 80px; left: 12px; right: 12px; } }
.toast {
  background: var(--bg-2); border:1px solid var(--line); border-left: 4px solid var(--accent);
  padding: 12px 18px; border-radius: 10px; box-shadow: var(--shadow); font-size: 14px;
  animation: toast-in .25s ease; min-width: 220px;
}
.toast.success { border-left-color: var(--green); }
.toast.error { border-left-color: var(--red); }
@keyframes toast-in { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }

/* FUNIL */
.funnel { display:flex; flex-direction: column; gap: 8px; }
.funnel-step {
  display: grid; grid-template-columns: 170px 1fr 110px 90px; gap: 12px; align-items: center;
  padding: 11px 13px; background: var(--panel-2); border-radius: 10px;
  border: 1px solid var(--line);
}
.funnel-step .name { font-size: 13px; font-weight: 600; }
.funnel-step .bar { height: 20px; background: var(--bg); border-radius: 8px; overflow: hidden; position: relative; }
.funnel-step .bar > div {
  height: 100%; transition: width .3s ease; border-radius: 8px;
}
.funnel-step .num { font-weight: 700; font-size: 15px; text-align: right; }
.funnel-step .conv { font-size: 12px; color: var(--muted); text-align: right; }
@media (max-width: 700px) {
  .funnel-step { grid-template-columns: 1fr 90px; gap: 6px; padding: 10px; }
  .funnel-step .bar { display: none; }
  .funnel-step .conv { display: none; }
  .funnel-step .num { font-size: 14px; }
}

/* STAGE BUTTONS */
.stage-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (max-width: 700px) { .stage-grid { grid-template-columns: repeat(2, 1fr); } }
.stage-btn {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px; padding: 14px;
  cursor: pointer; transition: all .15s; text-align: left; color: var(--text);
  display:flex; flex-direction: column; gap: 8px;
}
.stage-btn:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow); }
.stage-btn .stage-name { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
.stage-btn .stage-count { font-size: 32px; font-weight: 800; line-height: 1; }
.stage-btn .stage-actions { display:flex; gap: 5px; margin-top: 4px; flex-wrap: wrap; }
.stage-btn .stage-actions .btn { padding: 6px 10px; font-size: 11px; }

/* CHIPS */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  padding: 6px 12px; background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 999px; font-size: 12px; cursor: pointer; transition: all .15s;
  color: var(--muted); font-weight: 600;
}
.chip:hover { border-color: var(--accent-2); color: var(--text); }
.chip.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }

/* NEARBY IMOB BUTTONS */
.nearby-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (max-width: 600px) { .nearby-grid { grid-template-columns: 1fr; } }
.nearby-btn {
  display:flex; flex-direction: column; gap: 4px; padding: 14px; border-radius: 12px;
  background: var(--panel-2); border: 2px solid var(--line); cursor: pointer; text-align: left;
  color: var(--text); transition: all .15s;
}
.nearby-btn:hover, .nearby-btn.active { border-color: var(--accent); background: rgba(212,176,106,.05); }
.nearby-btn .nb-name { font-weight: 700; font-size: 14px; }
.nearby-btn .nb-dist { font-size: 11px; color: var(--accent-2); font-weight: 700; }
.nearby-btn .nb-meta { font-size: 11px; color: var(--muted); }

/* AUTOCOMPLETE */
.autocomplete { position: relative; }
.autocomplete-list {
  position: absolute; left: 0; right: 0; top: 100%; z-index: 30;
  background: var(--bg-2); border: 1px solid var(--line); border-top: 0;
  max-height: 240px; overflow-y: auto; border-radius: 0 0 10px 10px;
  box-shadow: var(--shadow); display:none;
}
.autocomplete-list.open { display: block; }
.autocomplete-list div { padding: 10px 14px; cursor: pointer; font-size: 13px; }
.autocomplete-list div:hover, .autocomplete-list div.hl { background: var(--panel-2); color: var(--accent-2); }

/* RANK LIST */
.rank { display: flex; flex-direction: column; gap: 8px; }
.rank-row {
  display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 12px;
  padding: 10px 12px; background: var(--panel-2); border-radius: 10px; border: 1px solid var(--line);
}
.rank-row .pos { font-weight: 800; color: var(--accent); font-size: 16px; }
.rank-row .name { font-weight: 600; font-size: 13px; }
.rank-row .meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
.rank-row .val { font-weight: 700; font-size: 13px; }

/* VISIT CARD */
.visit-card {
  text-align: center; padding: 22px;
  background: linear-gradient(135deg, var(--panel) 0%, var(--panel-2) 100%);
  border: 1px solid var(--line); border-radius: 18px;
}
.visit-card .big-emoji { font-size: 50px; margin-bottom: 4px; }
.visit-status { font-size: 13px; color: var(--muted); margin-top: 10px; }
.gps-pill {
  display:inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
  background: rgba(34,197,94,.15); color: #16a34a; border-radius: 999px; font-size: 11px; font-weight: 700;
}
[data-theme="dark"] .gps-pill { color: #86efac; }
.gps-pill.warn { background: rgba(245,158,11,.18); color: #b45309; }
[data-theme="dark"] .gps-pill.warn { color: #fde68a; }
.gps-pill.err { background: rgba(239,68,68,.18); color: #b91c1c; }
[data-theme="dark"] .gps-pill.err { color: #fecaca; }

/* SEGMENTED */
.seg { display: inline-flex; padding: 3px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; gap: 2px; flex-wrap: wrap; }
.seg button {
  background: transparent; border:0; color: var(--muted); padding: 7px 12px; border-radius: 7px;
  font-size: 12px; cursor: pointer; font-weight: 600;
}
.seg button.active { background: var(--accent); color: var(--accent-text); }

/* CHART */
.chart-box { position: relative; height: 280px; }
.chart-box.lg { height: 340px; }
.chart-box.sm { height: 220px; }
@media (max-width: 600px) { .chart-box, .chart-box.lg { height: 240px; } .chart-box.sm { height: 200px; } }

/* LEADS */
.lead-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.lead-card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px; display: flex; flex-direction: column; gap: 8px;
  transition: border-color .15s, transform .1s;
}
.lead-card:hover { border-color: var(--accent-2); }
.lead-card.stale { border-color: rgba(239,68,68,.55); box-shadow: 0 0 0 2px rgba(239,68,68,.12); }
.lead-card.due   { border-color: rgba(245,158,11,.6); }
.lead-card .lc-head { display:flex; justify-content:space-between; align-items:flex-start; gap: 8px; }
.lead-card .lc-name { font-weight: 700; font-size: 15px; color: var(--text); line-height: 1.2; }
.lead-card .lc-meta { font-size: 12px; color: var(--muted); }
.lead-card .lc-chips { display:flex; flex-wrap:wrap; gap: 4px; }
.lead-card .lc-actions { display:flex; flex-wrap:wrap; gap: 6px; margin-top: 4px; }
.lead-stage {
  display:inline-block; padding: 3px 9px; border-radius: 999px;
  font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px;
}
.lead-stage.interessados   { background: rgba(59,130,246,.18); color:#3b82f6; }
.lead-stage.agendamentos   { background: rgba(168,85,247,.18); color:#a855f7; }
.lead-stage.atendimentos   { background: rgba(20,184,166,.18); color:#14b8a6; }
.lead-stage.negociacao     { background: rgba(245,158,11,.20); color:#f59e0b; }
.lead-stage.venda          { background: rgba(34,197,94,.20); color:#16a34a; }
.lead-stage.descartado     { background: rgba(239,68,68,.18); color:#ef4444; }
.lead-stage.fechado        { background: rgba(107,114,128,.20); color:#9ca3af; }
.lead-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lead-form-grid .full { grid-column: 1 / -1; }
@media (max-width: 600px) { .lead-form-grid { grid-template-columns: 1fr; } }
.lead-history { font-size: 12px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; margin-top: 6px; }
.lead-history .h-item { padding: 4px 0; }
.alert-banner {
  background: linear-gradient(135deg, rgba(245,158,11,.12), rgba(239,68,68,.12));
  border: 1px solid rgba(245,158,11,.35); border-radius: 14px;
  padding: 12px 14px; margin-bottom: 14px; display:flex; align-items:center; gap: 12px; flex-wrap:wrap;
}
.alert-banner .ico { font-size: 22px; }
.alert-banner .body { flex: 1; min-width: 200px; }
.alert-banner .body b { color: var(--text); }

/* EMPTY */
.empty { text-align: center; padding: 40px 16px; color: var(--muted); }
.empty .icon-big { font-size: 48px; margin-bottom: 10px; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; }
::-webkit-scrollbar-thumb:hover { background: var(--panel-2); }
::-webkit-scrollbar-track { background: transparent; }

.center { text-align: center; }
.right { text-align: right; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.mt-12 { margin-top: 12px; } .mt-20 { margin-top: 20px; } .mb-12 { margin-bottom: 12px; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* LOGIN */
.login-screen {
  position: fixed; inset: 0; background: var(--bg-grad-1), var(--bg);
  display:flex; align-items: center; justify-content: center; padding: 20px; z-index: 500;
}
.login-card {

}
.login-card .logo {

.login-card .tagline { color: var(--muted); margin-bottom: 24px; font-size: 14px; }
.login-card .form { gap: 14px; text-align: left; }

@media print { .sidebar, .topbar, .toolbar, .btn, .bottom-nav { display: none !important; } }
</style>

  db.imobiliarias = db.imobiliarias.map(im => {
    const cur = normImob(im);
    const s = seedMap[cur.nome];
    if (s && cur.lat == null && s.lat != null) {
      cur.lat = s.lat; cur.lng = s.lng;
      cur.endereco = cur.endereco || s.endereco;
      filled++;
    }
    return cur;
  });
  if (filled) console.log(`mergeSeedCoords: ${filled} imobiliárias enriquecidas com coords do seed`);
  return db;
}
function ensureSeedUsers(db) {
  /* Garante que admin e usuários por GPI existem no DB (sem sobrescrever senhas alteradas). */
  if (!db) return db;
  db.users = db.users || [];
  // Limpa emails antigos (renato@/nishi@/etc.) que não existem mais no seed
  if (Array.isArray(DEPRECATED_EMAILS) && DEPRECATED_EMAILS.length) {
    db.users = db.users.filter(u => !DEPRECATED_EMAILS.includes((u.email||'').toLowerCase()));
  }
  const idx = e => db.users.findIndex(u => (u.email||'').toLowerCase() === e.toLowerCase());
  if (idx(SEED_ADMIN.email) < 0) db.users.push({...SEED_ADMIN});
  (typeof SEED_ADMIN_USERS !== 'undefined' ? SEED_ADMIN_USERS : []).forEach(u => { if (idx(u.email) < 0) db.users.push({...u}); });
  SEED_GPI_USERS.forEach(u => { if (idx(u.email) < 0) db.users.push({...u}); });
  
  // MIGRAR LEADS ANTIGOS PARA NEGÓCIOS
  db.negocios = db.negocios || [];
  if (db.leads && db.leads.length > 0) {
    db.leads.forEach(l => {
      db.negocios.push({
        id: l.id || Math.random().toString(36).substr(2,9),
        data: l.dataCadastro || l.data || new Date().toISOString().slice(0,10),
        status: l.etapa || 'INTERESSADOS',
        produto: l.produto || '',
        unidade: '',
        vgv: l.valorEstimado || 0,
        cliente1: l.nome || '',
        fone1: l.telefone || '',
        estrutura: 'PARCERIAS',
        responsavel: l.gpi || '',
        imobiliaria: l.imobiliaria || '',
        corretor: l.corretor || '',
        proximoFollowup: l.proximoFollowup || '',
        historico: l.historico || [],
        criadoPor: l.gpi || 'Sistema',
        dataUltimaAtualizacao: l.ultimaAtualizacao || new Date().toISOString().slice(0,10)
      });
    });
    db.leads = []; // limpa para não duplicar na próxima carga
  }
  return db;
}
function loadLocalDB() {
  const seed = loadSeed();
  try {
    const raw = safeLocal.getItem(STORAGE_KEY);
    if (raw) return ensureSeedUsers(mergeSeedCoords(JSON.parse(raw), seed));

function haversine(a, b) { // km
  const R=6371, dLat=(b.lat-a.lat)*Math.PI/180, dLng=(b.lng-a.lng)*Math.PI/180;
  const A = Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(A));
}

function requestGPS(opts = {}) {
  return new Promise(resolve => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(pos => {
      GPS_POSITION = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy };
      resolve(GPS_POSITION);
    }, () => resolve(null), { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000, ...opts });
  });
}

function periodRange(p) {
  const today = new Date();
  const iso = d => d.toISOString().slice(0,10);
  if (p === 'hoje') return [iso(today), iso(today)];
  if (p === 'semana') {
    const d = new Date(today); d.setDate(d.getDate() - 6);
    return [iso(d), iso(today)];
  }
  if (p === 'mes') return [iso(today).slice(0,7)+'-01', iso(today)];
  if (p === 'trim') {
    const d = new Date(today); d.setMonth(d.getMonth() - 2); d.setDate(1);
    return [iso(d), iso(today)];
  }
  if (p === 'ano') return [iso(today).slice(0,4)+'-01-01', iso(today)];
  if (p === 'custom') return [DASH_FILTER.from, DASH_FILTER.to];
  return [null, null];
}
function inPeriod(date, [from, to]) {
  if (!from && !to) return true;
  if (!date) return false;
  const d = date.slice(0,10);
  return (!from || d >= from) && (!to || d <= to);
}
function dashFilter(items, getDate, getResp) {
  const [from, to] = periodRange(DASH_FILTER.period);
  return items.filter(x => inPeriod(getDate(x), [from, to]))
    .filter(x => !DASH_FILTER.gpi || getResp(x) === DASH_FILTER.gpi);
}

  ` : (ativos.length ? `<div class="alert-banner mb-12" style="border-color: rgba(34,197,94,.35);">

  $('#funil-gpi-pill').textContent = periodLabel;

  renderFunil('funil-gpi-cont', FUNIL_GPI, META_GPI, DB.metaMes.gpiContatos, 'GPI');

  // Ranking by VGV
  const byResp = {};
  vendas.forEach(v => { const k = v.responsavel || '—'; byResp[k] = byResp[k] || { vendas:0, vgv:0 }; byResp[k].vendas++; byResp[k].vgv += Number(v.vgv)||0; });
  const rankGpi = Object.entries(byResp).map(([k,v])=>({nome:k,...v})).sort((a,b)=>b.vgv-a.vgv);
  $('#rank-gpi').innerHTML = rankGpi.length ? `<div class="rank">${rankGpi.slice(0,8).map((r,i)=>`
    <div class="rank-row"><div class="pos">#${i+1}</div>
      <div><div class="name">${escapeHtml(r.nome)}</div><div class="meta">${r.vendas} vendas</div></div>
      <div class="val">${fmtBRLk(r.vgv)}</div></div>`).join('')}</div>` : '<div class="empty">Sem vendas no período.</div>';

  const byCorr = {};
  vendas.forEach(v => { const k = (v.imobiliaria || v.corretor || '—').trim() || '—'; byCorr[k] = byCorr[k] || { vendas:0, vgv:0 }; byCorr[k].vendas++; byCorr[k].vgv += Number(v.vgv)||0; });
  const rankCorr = Object.entries(byCorr).filter(([k])=>k!=='—').map(([k,v])=>({nome:k,...v})).sort((a,b)=>b.vgv-a.vgv);
  $('#rank-corretor').innerHTML = rankCorr.length ? `<div class="rank">${rankCorr.slice(0,8).map((r,i)=>`
    <div class="rank-row"><div class="pos">#${i+1}</div>
      <div><div class="name truncate" style="max-width:180px;">${escapeHtml(r.nome)}</div><div class="meta">${r.vendas} vendas</div></div>
      <div class="val">${fmtBRLk(r.vgv)}</div></div>`).join('')}</div>` : '<div class="empty small">Cadastre imobiliária/corretor nos negócios para ver o ranking.</div>';

  renderChartMix(vendas);
  renderChartProduto(vendas);
  renderChartMonthly(DB.negocios.filter(n => n.status === 'VENDA' && (!DASH_FILTER.gpi || n.responsavel === DASH_FILTER.gpi)));
  renderChartVisitas(visitas);
  renderChartAtividade();
}

function renderFunil(containerId, etapas, metas, baseTotal, papel) {
  const cont = document.getElementById(containerId);
  if (!cont) return;
  const realiz = {};
  etapas.forEach(e => realiz[e] = 0);

  const peoplePool = papel === 'GPI' ? DB.gpis : DB.executivos;
  const inPapel = (resp) => DASH_FILTER.gpi ? (resp === DASH_FILTER.gpi && peoplePool.includes(resp)) : peoplePool.includes(resp);

  dashFilter(DB.funil, f => f.data, f => f.pessoa).filter(f => f.papel === papel).forEach(f => {
    if (!DASH_FILTER.gpi || f.pessoa === DASH_FILTER.gpi) {
      if (realiz[f.etapa] !== undefined) realiz[f.etapa] += Number(f.qtd)||0;
    }
  });

  dashFilter(DB.negocios, n => n.dataAssinatura||n.data, n => n.responsavel)
    .filter(n => inPapel(n.responsavel))
    .forEach(n => { if (n.status && realiz[n.status] !== undefined) realiz[n.status]++; });

  const proj = {};
  let prev = baseTotal;
  etapas.forEach(e => {
    if (metas[e] === null) proj[e] = baseTotal;
    else { prev = prev * metas[e]; proj[e] = prev; }
  });

  cont.innerHTML = `<div class="funnel">${etapas.map((e, i) => {
    const r = realiz[e]; const p = proj[e];
    const pct = p > 0 ? Math.min(1, r/p) : 0;
    const label = e.length > 22 ? e.slice(0,20)+'…' : e;
    return `<div class="funnel-step" title="${escapeHtml(e)}">
      <div class="name">${escapeHtml(label)}</div>
      <div class="bar"><div style="width:${(pct*100).toFixed(1)}%; background: linear-gradient(90deg, ${STAGE_COLORS[i%STAGE_COLORS.length]} 0%, var(--accent) 100%);"></div></div>
      <div class="num">${fmtNum(r)} <span class="muted small">/ ${fmtNum(Math.round(p))}</span></div>
      <div class="conv">${fmtPct(pct)}</div></div>`;
  }).join('')}</div>`;
}

let _charts = {};
function destroyChart(id) { if (_charts[id]) { _charts[id].destroy(); delete _charts[id]; } }
function chartTickColor() { return getComputedStyle(document.body).getPropertyValue('--chart-tick').trim() || '#8aa0c2'; }
function chartGridColor() { return getComputedStyle(document.body).getPropertyValue('--chart-grid').trim() || 'rgba(138,160,194,.1)'; }

function renderChartMix(vendas) {
  destroyChart('mix');
  const byProd = {};
  vendas.forEach(v => { const k = v.produto || '—'; byProd[k] = (byProd[k]||0) + (Number(v.vgv)||0); });
  const labels = Object.keys(byProd);
  if (!labels.length) { $('#chart-mix').parentElement.innerHTML = '<div class="empty small">Sem vendas.</div>'; return; }
  const data = Object.values(byProd);
  const colors = ['#d4b06a','#3b82f6','#22c55e','#a855f7','#f59e0b','#14b8a6','#ec4899','#ef4444','#8b5cf6','#10b981','#f97316','#06b6d4','#84cc16'];
  _charts.mix = new Chart($('#chart-mix'), {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: colors, borderColor: getComputedStyle(document.body).getPropertyValue('--bg-2').trim(), borderWidth:2 }]},
    options: { plugins:{ legend:{ position:'right', labels:{ color: chartTickColor(), font:{ size:11 }, boxWidth:12 }}, tooltip:{ callbacks:{ label: c => c.label+': '+fmtBRLk(c.parsed) }}}, cutout:'62%', maintainAspectRatio:false }
  });
}
function renderChartProduto(vendas) {
  destroyChart('produto');
  const byProd = {};
  vendas.forEach(v => { const k = v.produto || '—'; byProd[k] = (byProd[k]||0) + (Number(v.vgv)||0); });
  const sorted = Object.entries(byProd).sort((a,b)=>b[1]-a[1]);
  if (!sorted.length) return;
  _charts.produto = new Chart($('#chart-produto'), {
    type: 'bar',
    data: { labels: sorted.map(s=>s[0]), datasets: [{ label:'VGV', data: sorted.map(s=>s[1]),
      backgroundColor: ctx => { const g = ctx.chart.ctx.createLinearGradient(0,0,0,300); g.addColorStop(0,'#f0c987'); g.addColorStop(1,'#d4b06a'); return g; }, borderRadius: 6 }]},
    options: { plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label: c => fmtBRL(c.parsed.y) }}},
      scales: { x: { ticks:{ color: chartTickColor(), font:{size:11} }, grid:{ display:false }},
                y: { ticks:{ color: chartTickColor(), callback: v=>fmtBRLk(v) }, grid:{ color: chartGridColor() }}},
      maintainAspectRatio:false }
  });
}
function renderChartMonthly(allVendas) {
  destroyChart('monthly');
  const byMonth = {};
  allVendas.forEach(v => { const m = (v.dataAssinatura||v.data||'').slice(0,7); if (!m) return; byMonth[m] = (byMonth[m]||0) + (Number(v.vgv)||0); });
  const labels = Object.keys(byMonth).sort();
  if (!labels.length) return;
  const data = labels.map(l => byMonth[l]);
  _charts.monthly = new Chart($('#chart-monthly'), {
    type: 'line',
    data: { labels, datasets: [{ label:'VGV', data, fill: true, tension: .35,
      borderColor: '#d4b06a', backgroundColor: 'rgba(212,176,106,.18)',
      pointBackgroundColor: '#f0c987', pointRadius: 4, borderWidth: 3 }]},
    options: { plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label: c => fmtBRL(c.parsed.y) }}},
      scales: { x:{ ticks:{ color: chartTickColor() }, grid:{display:false} }, y:{ ticks:{ color: chartTickColor(), callback: v=>fmtBRLk(v) }, grid:{ color: chartGridColor() }}},
      maintainAspectRatio:false }
  });
}
function renderChartVisitas(visitas) {
  destroyChart('visitas');
  const byGpi = {};
  visitas.forEach(v => { byGpi[v.gpi||'—'] = (byGpi[v.gpi||'—']||0) + 1; });
  DB.gpis.forEach(g => byGpi[g] = byGpi[g] || 0);
  const labels = Object.keys(byGpi);
  const data = labels.map(l => byGpi[l]);
  _charts.visitas = new Chart($('#chart-visitas'), {
    type: 'bar',
    data: { labels, datasets: [{ label:'Visitas', data, backgroundColor: '#3b82f6', borderRadius: 6 }]},
    options: { indexAxis: 'y', plugins:{ legend:{display:false}},
      scales: { x:{ ticks:{ color: chartTickColor()}, grid:{ color: chartGridColor() }},
                y:{ ticks:{ color: chartTickColor()}, grid:{display:false}}},
      maintainAspectRatio: false }
  });
}
function renderChartAtividade() {
  destroyChart('atividade');
  const days = [];
  for (let i=13; i>=0; i--) { const d = new Date(); d.setDate(d.getDate()-i); days.push(d.toISOString().slice(0,10)); }
  const counts = days.map(d => {
    const f = DB.funil.filter(f => f.data === d && f.papel === 'GPI' && (!DASH_FILTER.gpi || f.pessoa === DASH_FILTER.gpi)).reduce((s,f)=>s+(Number(f.qtd)||0),0);
    const v = DB.visitas.filter(v => v.data === d && (!DASH_FILTER.gpi || v.gpi === DASH_FILTER.gpi)).length;
    return f + v;
  });
  _charts.atividade = new Chart($('#chart-atividade'), {
    type: 'bar',
    data: { labels: days.map(d=>d.slice(8,10)+'/'+d.slice(5,7)), datasets: [{ label:'Eventos', data: counts, backgroundColor: '#22c55e', borderRadius:5 }]},
    options: { plugins:{ legend:{display:false}}, scales:{ x:{ ticks:{ color: chartTickColor(), font:{size:10}}, grid:{display:false}}, y:{ ticks:{ color: chartTickColor()}, grid:{ color: chartGridColor() }}}, maintainAspectRatio:false }
  });
}

VIEWS.visita = async () => {
  const visitasHoje = DB.visitas.filter(v => v.data === todayISO()).length;
  const myGpi = CURRENT_USER?.gpiAssoc || null;
  const lockGpi = !isAdmin() && !!myGpi;
  $('#app').innerHTML = `
    <div class="page-head">
      <div><h1>Registrar Visita</h1><p>Imobiliárias próximas detectadas via GPS · 1 toque pra registrar.</p></div>
      <span class="badge gold">${visitasHoje} hoje</span>
    </div>

    <div class="grid grid-2 mb-12">
      <div class="card">
        ${lockGpi
          ? `<div class="card-title">1. Visitando como <span class="badge gold">${escapeHtml(myGpi)}</span></div>`
          : `<div class="card-title">1. Quem está visitando?</div>
             <div class="chips" id="visit-gpi">
               ${DB.gpis.map(g => `<div class="chip ${(CURRENT_USER && (CURRENT_USER.gpiAssoc===g || CURRENT_USER.nome?.includes(g)))?'active':''}" data-g="${escapeHtml(g)}">${escapeHtml(g)}</div>`).join('')}

        <div class="card-title mt-20">2. Imobiliária <span id="gps-state" class="gps-pill warn">⏳ buscando GPS...</span></div>
        <div id="nearby-list"></div>

        <div style="margin-top: 14px;">
          <label>Buscar / Outra</label>
          <div class="autocomplete">
            <input id="visit-imob" placeholder="Digite o nome da imobiliária..." autocomplete="off"/>
            <div id="visit-imob-list" class="autocomplete-list"></div>
          </div>
          <button class="btn sm mt-12" onclick="addImobNova()">+ Cadastrar nova imobiliária aqui</button>
        </div>

        <div class="card-title mt-20">3. Resumo (opcional)</div>
        <div class="form-row">
          <div><label>Corretores impactados</label><input type="number" id="visit-corretores" min="0" value="0"/></div>
          <div><label>Tipo</label>
            <select id="visit-tipo"><option>Visita</option><option>Treinamento</option><option>Disparo</option><option>Reunião</option><option>Ação de campo</option></select>
          </div>
        </div>
        <div><label>Observação</label><textarea id="visit-obs" placeholder="Ex: apresentei lançamento Verdant..."></textarea></div>
      </div>

      <div class="card visit-card">
        <div class="big-emoji">📍</div>
        <h2>Tudo pronto?</h2>
        <div id="visit-status" class="visit-status">Selecione o GPI e a imobiliária</div>
        <button class="btn primary giant mt-20" id="btn-visit-save" disabled>📍 REGISTRAR VISITA</button>
        <button class="btn ghost mt-12 sm" id="btn-visit-nogps">Registrar sem GPS</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Últimas visitas</div>
      <div id="visit-list"></div>
    </div>
  `;

  let selGpi = lockGpi ? myGpi : null; let selImob = null;
  if (!lockGpi) {
    $$('#visit-gpi .chip').forEach(c => {
      if (c.classList.contains('active')) selGpi = c.dataset.g;
      c.addEventListener('click', () => {
        $$('#visit-gpi .chip').forEach(x => x.classList.remove('active'));
        c.classList.add('active'); selGpi = c.dataset.g; updateStatus();
      });
    });
  }

  // GPS + nearby
  const gps = await requestGPS();
  const gpsEl = $('#gps-state');
  if (gps) { gpsEl.className = 'gps-pill'; gpsEl.innerHTML = `📡 ${Math.round(gps.accuracy)}m`; }
  else { gpsEl.className = 'gps-pill err'; gpsEl.innerHTML = '⚠️ GPS off'; }
  renderNearby(gps);

  setupAutocomplete($('#visit-imob'), $('#visit-imob-list'), DB.imobiliarias.map(i => i.nome), val => { selectImob({ nome: val }); });

  function selectImob(imob) {
    selImob = imob;
    $('#visit-imob').value = imob.nome;
    $$('#nearby-list .nearby-btn').forEach(b => b.classList.toggle('active', b.dataset.nome === imob.nome));
    updateStatus();
  }
  window._selectImob = selectImob;

  function renderNearby(gps) {
    if (!gps) {
      $('#nearby-list').innerHTML = '<div class="muted small">GPS indisponível — use a busca abaixo.</div>';
      return;
    }
    const withCoords = DB.imobiliarias.filter(i => i.lat && i.lng).map(i => ({...i, dist: haversine(gps, {lat:i.lat,lng:i.lng})}));
    withCoords.sort((a,b)=>a.dist-b.dist);
    const top = withCoords.slice(0,5);
    if (!top.length) {
      $('#nearby-list').innerHTML = '<div class="muted small">Nenhuma imobiliária com coordenadas ainda. Registre a primeira visita e o GPS será salvo automaticamente para próximas detecções.</div>';
      return;
    }
    $('#nearby-list').innerHTML = `<div class="nearby-grid">${top.map(i=>`
      <button class="nearby-btn" data-nome="${escapeHtml(i.nome)}" onclick='_selectImob(${JSON.stringify(i)})'>

  }

  function updateStatus() {
    const valid = selGpi && (selImob || $('#visit-imob').value.trim());
    $('#btn-visit-save').disabled = !valid;
    if (selGpi && (selImob || $('#visit-imob').value.trim())) $('#visit-status').textContent = `Pronto · ${selGpi} → ${selImob?.nome || $('#visit-imob').value}`;

    else $('#visit-status').textContent = `Selecione GPI e imobiliária`;
  }
  $('#visit-imob').addEventListener('input', () => { selImob = null; updateStatus(); });

  function saveVisit(allowNoGps) {
    if (!selGpi) return toast('Selecione o GPI', 'error');
    const nomeImob = (selImob?.nome || $('#visit-imob').value.trim());
    if (!nomeImob) return toast('Selecione/digite a imobiliária', 'error');
    if (!GPS_POSITION && !allowNoGps) return toast('Aguarde o GPS ou clique em "Registrar sem GPS"', 'error');

    let imobObj = DB.imobiliarias.find(i => i.nome.toLowerCase() === nomeImob.toLowerCase());
    if (!imobObj) {
      imobObj = { nome: nomeImob, lat: GPS_POSITION?.lat ?? null, lng: GPS_POSITION?.lng ?? null, endereco: '' };
      DB.imobiliarias.push(imobObj);
    } else if (!imobObj.lat && GPS_POSITION) {
      imobObj.lat = GPS_POSITION.lat; imobObj.lng = GPS_POSITION.lng;
    }

    const v = {
      id: uid(), data: todayISO(), hora: new Date().toTimeString().slice(0,5),
      gpi: selGpi, imobiliaria: imobObj.nome,
      lat: GPS_POSITION?.lat ?? null, lng: GPS_POSITION?.lng ?? null, accuracy: GPS_POSITION?.accuracy ?? null,
      corretoresImpactados: Number($('#visit-corretores').value)||0,
      tipo: $('#visit-tipo').value, obs: $('#visit-obs').value.trim(),
      criadoPor: CURRENT_USER.email,
    };
    DB.visitas.unshift(v);
    DB.funil.push({ id: uid(), data: v.data, papel:'GPI', pessoa: selGpi, etapa: 'CONTATOS EFETIVOS', qtd: 1, obs: 'Visita: '+imobObj.nome, ref: v.id });
    if (v.corretoresImpactados > 0) {
      DB.funil.push({ id: uid(), data: v.data, papel:'GPI', pessoa: selGpi, etapa: 'INTERESSADOS', qtd: v.corretoresImpactados, obs:'Corretores impactados em '+imobObj.nome, ref: v.id });
    }
    saveDB(); toast('Visita registrada ✓', 'success');
    VIEWS.visita();
  }
  $('#btn-visit-save').addEventListener('click', () => saveVisit(false));
  $('#btn-visit-nogps').addEventListener('click', () => saveVisit(true));

  const last = DB.visitas.slice(0,15);
  $('#visit-list').innerHTML = last.length ? `<div class="table-wrap"><table>
    <thead><tr><th>Data</th><th>Hora</th><th>GPI</th><th>Imobiliária</th><th>Tipo</th><th>Impact.</th><th>GPS</th>${isAdmin()?'<th></th>':''}</tr></thead>
    <tbody>${last.map(v => `<tr>
      <td>${v.data}</td><td>${v.hora||''}</td><td>${escapeHtml(v.gpi||'')}</td>
      <td>${escapeHtml(v.imobiliaria||'')}</td>
      <td><span class="badge gray">${escapeHtml(v.tipo||'Visita')}</span></td>
      <td>${v.corretoresImpactados||0}</td>
      <td>${v.lat ? `<a href="https://maps.google.com/?q=${v.lat},${v.lng}" target="_blank">📍</a>` : '—'}</td>
      ${isAdmin()?`<td><button class="btn sm danger" onclick="deleteVisit('${v.id}')">×</button></td>`:''}
    </tr>`).join('')}</tbody></table></div>` : '<div class="empty"><div class="icon-big">📍</div>Nenhuma visita ainda hoje. Faça a primeira do dia!</div>';
};

function addImobNova() {
  const nome = prompt('Nome da nova imobiliária:');
  if (!nome) return;
  const t = nome.trim();
  if (!t) return;
  if (DB.imobiliarias.some(i => i.nome.toLowerCase() === t.toLowerCase())) return toast('Já existe na lista','error');
  DB.imobiliarias.push({ nome: t, lat: GPS_POSITION?.lat || null, lng: GPS_POSITION?.lng || null, endereco: '' });
  saveDB();
  $('#visit-imob').value = t;
  $('#visit-imob').dispatchEvent(new Event('input'));
  toast('Imobiliária cadastrada ✓ Selecione-a no campo','success');
  VIEWS.visita();
}

function deleteVisit(id) {
  if (!isAdmin()) return toast('Apenas admin','error');
  if (!confirm('Excluir essa visita?')) return;
  DB.visitas = DB.visitas.filter(v => v.id !== id);
  DB.funil = DB.funil.filter(f => f.ref !== id);
  saveDB(); VIEWS.visita();
}

/* ============= FUNIL GPI ============= */
VIEWS.funil = () => {
  // Não-admins ficam travados na própria atribuição (CURRENT_USER.gpiAssoc / executivoAssoc)
  const myGpi  = CURRENT_USER?.gpiAssoc || null;
  const myExec = CURRENT_USER?.executivoAssoc || null;
  const lockPessoa = !isAdmin() && (myGpi || myExec);
  const initialPapel = (!isAdmin() && myExec && !myGpi) ? 'EXEC' : 'GPI';

  $('#app').innerHTML = `
    <div class="page-head">
      <div><h1>Funil GPI · Entrada Rápida</h1>
        <p>${lockPessoa
            ? `Lançando como <b>${escapeHtml(myGpi||myExec)}</b> (${myGpi?'GPI':'Executivo'}). <span class="muted">CONTATOS EFETIVOS = contagem rápida. INTERESSADOS+ abrem o cadastro de cliente.</span>`
            : 'Toque para incrementar. <span class="muted">CONTATOS EFETIVOS = contagem rápida. INTERESSADOS+ abrem o cadastro de cliente para gerar lead.</span>'}</p>
      </div>
      ${lockPessoa ? '' : '<div class="seg" id="funil-papel"><button data-r="GPI" class="active">GPIs</button><button data-r="EXEC">Executivos</button></div>'}
    </div>
    ${lockPessoa ? '' : '<div class="card mb-12"><div class="card-title">Pessoa</div><div class="chips" id="funil-pessoa"></div></div>'}
    <div class="card mb-12"><div class="card-title" id="funil-stage-title">Funil de Vendas</div><div class="funnel-container" id="funil-stages"></div></div>
    <div class="card"><div class="card-title">Últimos lançamentos</div><div id="funil-log"></div></div>
  `;
  let papel = lockPessoa ? (myGpi ? 'GPI' : 'EXEC') : initialPapel;
  let pessoa = lockPessoa ? (myGpi || myExec) : null;

  function renderPessoas() {
    if (lockPessoa) return;
    const list = papel === 'GPI' ? DB.gpis : DB.executivos;
    pessoa = pessoa && list.includes(pessoa) ? pessoa : list[0];
    $('#funil-pessoa').innerHTML = list.map(p => `<div class="chip ${p===pessoa?'active':''}" data-p="${escapeHtml(p)}">${escapeHtml(p)}</div>`).join('');
    $$('#funil-pessoa .chip').forEach(c => c.addEventListener('click', () => { pessoa = c.dataset.p; renderPessoas(); renderStages(); }));
  }
  function renderStages() {
    const etapas = papel === 'GPI' ? FUNIL_GPI : FUNIL_EXEC;
    const today = todayISO();
    const counts = {};
    etapas.forEach(e => { 
      counts[e] = DB.funil.filter(f => f.papel === papel && f.pessoa === pessoa && f.etapa === e && f.data === today).reduce((s,f)=>s+(Number(f.qtd)||0), 0); 
    });
    
    $('#funil-stage-title').innerHTML = `Funil · <span class="muted">${escapeHtml(pessoa||'')}</span> · hoje`;
    
    let html = '';
    etapas.forEach((e, i) => {
      const color = STAGE_COLORS[i % STAGE_COLORS.length];
      const count = counts[e] || 0;
      
      // Stage Box
      html += `
        <div class="funnel-stage" style="border-left: 4px solid ${color};">
          <div class="info">
            <div class="name">${escapeHtml(e)}</div>
            <div class="count" style="color:${color};">${count}</div>
          </div>
          <div class="actions">
            <button class="btn sm" data-act="inc" data-d="1"  data-etapa="${escapeHtml(e)}">+1</button>
            <button class="btn sm" data-act="inc" data-d="5"  data-etapa="${escapeHtml(e)}">+5</button>
            <button class="btn sm" data-act="inc-n"           data-etapa="${escapeHtml(e)}">+N</button>
            ${isAdmin()?`<button class="btn sm danger" data-act="inc" data-d="-1" data-etapa="${escapeHtml(e)}">−1</button>`:''}
          </div>
        </div>
      `;
      
      // Conversion Rate between stages
      if (i < etapas.length - 1) {
        const nextCount = counts[etapas[i+1]] || 0;
        const rate = count > 0 ? ((nextCount / count) * 100).toFixed(1) : '0.0';
        html += `
          <div class="funnel-conversion">
            <div class="funnel-conv-label">↘ ${rate}% conversão</div>
          </div>
        `;
      }
    });
    
    $('#funil-stages').innerHTML = html;
  }
  function renderLog() {
    const log = DB.funil.slice().sort((a,b)=> (b.data+b.id).localeCompare(a.data+a.id)).slice(0,15);
    $('#funil-log').innerHTML = log.length ? `<div class="table-wrap"><table>
      <thead><tr><th>Data</th><th>Papel</th><th>Pessoa</th><th>Etapa</th><th>Qtd</th><th>Obs</th>${isAdmin()?'<th></th>':''}</tr></thead>
      <tbody>${log.map(f => `<tr>
        <td>${f.data}</td>
        <td><span class="badge ${f.papel==='GPI'?'blue':'purple'}">${f.papel}</span></td>
        <td>${escapeHtml(f.pessoa||'')}</td><td>${escapeHtml(f.etapa||'')}</td><td>${f.qtd}</td>
        <td class="truncate" style="max-width:240px;">${escapeHtml(f.obs||'')}</td>
        ${isAdmin()?`<td><button class="btn sm danger" data-del="${f.id}">×</button></td>`:''}
      </tr>`).join('')}</tbody></table></div>` : '<div class="empty">Nenhum lançamento ainda.</div>';
  }
  // Delegação de cliques (substitui onclick com aspas embutidas)
  $('#funil-stages').addEventListener('click', e => {
    const b = e.target.closest('button[data-act]'); if (!b) return;
    const etapa = b.dataset.etapa;
    const delta = parseInt(b.dataset.d, 10);
    // Para etapas de lead em modo GPI: +1 abre modal de lead (cadastrar/avançar). +5 e -1 continuam como contagem rápida.
    if (papel === 'GPI' && LEAD_STAGES.includes(etapa) && b.dataset.act === 'inc' && delta === 1) {
      return openFunilLeadModal(papel, pessoa, etapa);
    }
    if (b.dataset.act === 'inc-n') return incFunilCustom(papel, pessoa, etapa);
    incFunil(papel, pessoa, etapa, delta);
  });
  $('#funil-log').addEventListener('click', e => {
    const b = e.target.closest('button[data-del]'); if (!b) return;
    deleteFunil(b.dataset.del);
  });
  if (!lockPessoa) {
    $('#funil-papel').addEventListener('click', e => {
      const b = e.target.closest('button[data-r]'); if (!b) return;
      papel = b.dataset.r;
      $$('#funil-papel button').forEach(x=>x.classList.toggle('active', x===b));
      renderPessoas(); renderStages();
    });
  }
  renderPessoas(); renderStages(); renderLog();
  window._reloadFunilLog = renderLog;
  window._reloadFunilStages = renderStages;
};

function incFunil(papel, pessoa, etapa, delta) {
  if (delta < 0) {
    if (!isAdmin()) return toast('Apenas admin pode reduzir','error');
    const idx = DB.funil.map((f,i)=>({f,i})).reverse().find(({f}) => f.papel===papel && f.pessoa===pessoa && f.etapa===etapa && f.data===todayISO());
    if (idx) DB.funil.splice(idx.i, 1);
  } else {
    DB.funil.push({ id: uid(), data: todayISO(), papel, pessoa, etapa, qtd: delta, obs:'', criadoPor: CURRENT_USER.email });
  }
  saveDB();
  if (window._reloadFunilStages) _reloadFunilStages();
  if (window._reloadFunilLog) _reloadFunilLog();
}
function incFunilCustom(papel, pessoa, etapa) {
  const v = prompt('Quantos adicionar em "'+etapa+'"?', '5');
  const n = parseInt(v); if (!n || n<=0) return;
  DB.funil.push({ id: uid(), data: todayISO(), papel, pessoa, etapa, qtd: n, obs:'', criadoPor: CURRENT_USER.email });
  saveDB();
  if (window._reloadFunilStages) _reloadFunilStages();
  if (window._reloadFunilLog) _reloadFunilLog();
}
function deleteFunil(id) {
  if (!isAdmin()) return toast('Apenas admin','error');
  DB.funil = DB.funil.filter(f => f.id !== id); saveDB();
  if (window._reloadFunilStages) _reloadFunilStages();
  if (window._reloadFunilLog) _reloadFunilLog();
}

/* ============= NEGÓCIOS / FOLLOW-UP ============= */

function daysSince(dateStr) {
  if (!dateStr) return Infinity;
  const d = new Date(dateStr.length === 10 ? dateStr + 'T00:00:00' : dateStr);
  if (isNaN(d)) return Infinity;
  const now = new Date(); now.setHours(0,0,0,0);
  const a = new Date(d); a.setHours(0,0,0,0);
  return Math.floor((now - a) / 86400000);
}
function addDaysISO(n) {
  const d = new Date(); d.setDate(d.getDate() + (n||0));
  return d.toISOString().slice(0,10);
}
function isNegocioAtivo(n) { return n.status !== 'VENDA' && n.status !== 'DESCARTADO'; }
function negocioIsStale(n) { return isNegocioAtivo(n) && daysSince(n.dataUltimaAtualizacao || n.data) > LEAD_STALE_DAYS; }
function negocioIsDue(n) {
  if (!isNegocioAtivo(n) || !n.proximoFollowup) return false;
  return daysSince(n.proximoFollowup) >= -LEAD_DUE_DAYS;
}
function negociosForCurrentScope() {
  const myGpi = CURRENT_USER?.gpiAssoc;
  if (!isAdmin() && myGpi) return DB.negocios.filter(n => n.responsavel === myGpi);
  return DB.negocios;
}
function staleNegociosForScope() { return negociosForCurrentScope().filter(negocioIsStale); }
function dueNegociosForScope()   { return negociosForCurrentScope().filter(negocioIsDue); }

function updateNavBadges() {
  const stale = staleNegociosForScope();
  const due   = dueNegociosForScope();
  const total = new Set([...stale, ...due].map(n => n.id)).size;
  const txt = total > 99 ? '99+' : String(total);
  ['#nav-negocios-badge','#bnav-negocios-badge'].forEach(sel => {
    const el = $(sel); if (!el) return;
    if (total > 0) { el.textContent = txt; el.style.display = 'inline-flex'; }
    else el.style.display = 'none';
  });
}

function createLead({ cliente, fone, corretor, imobiliaria, produto, gpi, etapa, obs }) {
  cliente = (cliente||'').trim();
  if (!cliente) { toast('Informe o nome do cliente','error'); return null; }
  if (!LEAD_STAGES.includes(etapa)) etapa = 'INTERESSADOS';
  const today = todayISO();
  const fup = addDaysISO(LEAD_FOLLOWUP_DAYS[etapa] || 3);
  const lead = {
    id: uid(),
    cliente, fone: (fone||'').trim(),
    corretor: (corretor||'').trim(),
    imobiliaria: (imobiliaria||'').trim(),
    produto: (produto||'').trim(),
    gpi: gpi || CURRENT_USER?.gpiAssoc || '',
    etapaAtual: etapa,
    dataCriacao: today,
    dataUltimaAtualizacao: today,
    proximoFollowup: fup,
    status: 'ativo',
    motivoDescarte: '',
    historico: [{ data: today, etapaDe: '—', etapaPara: etapa, obs: (obs||'').trim() || 'Lead cadastrado', autor: CURRENT_USER?.email||'' }],
    criadoPor: CURRENT_USER?.email || ''
  };
  DB.leads.push(lead);
  // alimenta o funil agregado também (incrementa 1 na etapa atual)
  DB.funil.push({ id: uid(), data: today, papel: 'GPI', pessoa: lead.gpi, etapa, qtd: 1, obs: 'Lead: '+cliente, criadoPor: CURRENT_USER?.email||'' });
  saveDB();
  toast('Lead "'+cliente+'" cadastrado em '+etapa, 'success');
  return lead;
}

function advanceLead(id, novaEtapa, obs) {
  const l = DB.leads.find(x => x.id === id); if (!l) return;
  if (!LEAD_STAGES.includes(novaEtapa)) return;
  const today = todayISO();
  l.historico.push({ data: today, etapaDe: l.etapaAtual, etapaPara: novaEtapa, obs: (obs||'').trim(), autor: CURRENT_USER?.email||'' });
  l.etapaAtual = novaEtapa;
  l.dataUltimaAtualizacao = today;
  l.proximoFollowup = addDaysISO(LEAD_FOLLOWUP_DAYS[novaEtapa] || 3);
  if (novaEtapa === 'VENDA') l.status = 'fechado';
  // alimenta o funil agregado
  DB.funil.push({ id: uid(), data: today, papel: 'GPI', pessoa: l.gpi, etapa: novaEtapa, qtd: 1, obs: 'Lead: '+l.cliente, criadoPor: CURRENT_USER?.email||'' });
  saveDB();
  toast('Lead "'+l.cliente+'" → '+novaEtapa, 'success');
  return l;
}

function discardLead(id, motivo) {
  const l = DB.leads.find(x => x.id === id); if (!l) return;
  l.status = 'descartado';
  l.motivoDescarte = (motivo||'').trim();
  l.dataUltimaAtualizacao = todayISO();
  l.historico.push({ data: todayISO(), etapaDe: l.etapaAtual, etapaPara: 'DESCARTADO', obs: motivo||'', autor: CURRENT_USER?.email||'' });
  saveDB();
  toast('Lead descartado: '+l.cliente, 'success');
}

function reactivateLead(id) {
  const l = DB.leads.find(x => x.id === id); if (!l) return;
  l.status = 'ativo';
  l.motivoDescarte = '';
  l.dataUltimaAtualizacao = todayISO();
  l.proximoFollowup = addDaysISO(LEAD_FOLLOWUP_DAYS[l.etapaAtual] || 3);
  saveDB();
  toast('Lead reativado: '+l.cliente, 'success');
}

function snoozeLead(id, days) {
  const l = DB.leads.find(x => x.id === id); if (!l) return;
  l.proximoFollowup = addDaysISO(days||3);
  l.dataUltimaAtualizacao = todayISO();
  saveDB();
  toast('Follow-up reagendado em '+days+'d','success');
}

function deleteLead(id) {
  if (!isAdmin()) return toast('Apenas admin pode apagar','error');
  DB.leads = DB.leads.filter(l => l.id !== id);
  saveDB();
  toast('Lead removido','success');
}

  const fupDias = l.proximoFollowup ? daysSince(l.proximoFollowup) : null; // negativo = futuro
  const fupLabel = fupDias === null ? '' :
    fupDias > 0 ? `🔴 follow-up venceu há ${fupDias}d` :
    fupDias === 0 ? '🟠 follow-up hoje' :

  const stages = LEAD_STAGES.filter(s => s !== l.etapaAtual);
  return `
  <div class="${cls}">

      <div>
        <div class="lc-name">${escapeHtml(l.cliente)}</div>

    </div>

      ${l.status === 'ativo' ? `Atualizado há ${dias===0?'hoje':dias+'d'} · ${fupLabel}`
                              : `<span class="lead-stage ${l.status==='descartado'?'descartado':'fechado'}">${l.status.toUpperCase()}</span>${l.motivoDescarte?' · '+escapeHtml(l.motivoDescarte):''}`}

function leadListClickHandler(e) {

  const snz = e.target.closest('button[data-snz]');
  const disc = e.target.closest('button[data-disc]');
  const react = e.target.closest('button[data-react]');
  const del = e.target.closest('button[data-del]');
  const hist = e.target.closest('button[data-hist]');
  if (snz)  { snoozeLead(snz.dataset.snz, 3); renderLeadsList(); updateLeadBadges(); }
  if (disc) {
    const motivo = prompt('Motivo do descarte:', '') || '';
    if (motivo === null) return;
    discardLead(disc.dataset.disc, motivo); renderLeadsList(); updateLeadBadges();
  }
  if (react){ reactivateLead(react.dataset.react); renderLeadsList(); updateLeadBadges(); }
  if (del)  { if (confirm('Apagar este lead permanentemente?')) { deleteLead(del.dataset.del); renderLeadsList(); updateLeadBadges(); } }
  if (hist) { showLeadHistory(hist.dataset.hist); }
}

      ${!gpiMode ? `<select id="neg-resp"><option value="">Responsável</option>${[...DB.gpis, ...DB.executivos].map(r=>`<option>${r}</option>`).join('')}</select>
      <select id="neg-estr"><option value="">Estrutura</option>${ESTRUTURAS.map(e=>`<option>${e}</option>`).join('')}</select>` : ''}
      <div class="spacer"></div>
      <span class="muted small" id="neg-count"></span>
    </div>
    <div class="card" style="padding:0;"><div class="table-wrap" id="neg-table"></div></div>
  `;
  const filters = { search:'', status:'', produto:'', resp: gpiMode ? myGpi : '', estr:'' };
  $('#neg-search').addEventListener('input', e => { filters.search = e.target.value.toLowerCase(); render(); });
  $('#neg-status').addEventListener('change', e => { filters.status = e.target.value; render(); });
  $('#neg-produto').addEventListener('change', e => { filters.produto = e.target.value; render(); });
  if (!gpiMode) {
    $('#neg-resp').addEventListener('change', e => { filters.resp = e.target.value; render(); });
    $('#neg-estr').addEventListener('change', e => { filters.estr = e.target.value; render(); });
  }

  function render() {
    const f = filters;
    const baseList = gpiMode ? DB.negocios.filter(n => n.responsavel === myGpi) : DB.negocios;
    const list = baseList.filter(n => {
      if (f.status && n.status !== f.status) return false;
      if (f.produto && n.produto !== f.produto) return false;
      if (f.resp && n.responsavel !== f.resp) return false;
      if (f.estr && n.estrutura !== f.estr) return false;
      if (f.search) {
        const s = (n.cliente1+' '+n.corretor+' '+n.imobiliaria+' '+n.unidade+' '+n.produto).toLowerCase();
        if (!s.includes(f.search)) return false;
      }
      return true;
    }).sort((a,b) => (b.dataAssinatura||b.data||'').localeCompare(a.dataAssinatura||a.data||''));
    $('#neg-count').textContent = `${list.length} negócio${list.length!==1?'s':''}`;
    if (!list.length) { $('#neg-table').innerHTML = '<div class="empty"><div class="icon-big">🏠</div>Nenhum negócio encontrado.</div>'; return; }

    if (gpiMode) {
      // TABELA SIMPLIFICADA PARA GPI
      $('#neg-table').innerHTML = `<table>
        <thead><tr><th>Status</th><th>Produto</th><th>Un.</th><th>Cliente</th><th>Follow-up</th><th>Imobiliária</th></tr></thead>
        <tbody>${list.map(n => {
          const stCls = n.status==='VENDA'?'green':n.status==='NEGOCIAÇÃO'?'orange':n.status==='ATENDIMENTOS'?'blue':n.status==='AGENDAMENTOS'?'purple':n.status==='DESCARTADO'?'gray':'';
          const fupStr = n.proximoFollowup ? `${n.proximoFollowup.slice(8,10)}/${n.proximoFollowup.slice(5,7)}` : '—';
          const fupWarn = negocioIsStale(n) ? ' ⚠️' : negocioIsDue(n) ? ' 📅' : '';
          return `<tr style="cursor:pointer;" onclick="editNegocio('${n.id}')">
            <td><span class="badge ${stCls}">${escapeHtml(n.status||'—')}</span></td>
            <td>${escapeHtml(n.produto||'—')}</td>
            <td>${escapeHtml(n.unidade||'—')}</td>
            <td class="truncate" style="max-width:200px;">${escapeHtml(n.cliente1||'—')}</td>
            <td>${fupStr}${fupWarn}</td>
            <td class="truncate" style="max-width:180px;">${escapeHtml(n.imobiliaria||n.corretor||'—')}</td>
          </tr>`;
        }).join('')}</tbody></table>`;
    } else {
      // TABELA COMPLETA PARA ADMIN / EXECUTIVO
      $('#neg-table').innerHTML = `<table>
        <thead><tr><th>Data</th><th>Status</th><th>Produto</th><th>Un.</th><th>Cliente</th><th>VGV</th><th>Estr.</th><th>Resp.</th><th>Follow-up</th><th>Imobiliária</th><th></th></tr></thead>
        <tbody>${list.map(n => {
          const date = (n.dataAssinatura||n.data||'').slice(0,10);
          const stCls = n.status==='VENDA'?'green':n.status==='NEGOCIAÇÃO'?'orange':n.status==='ATENDIMENTOS'?'blue':n.status==='AGENDAMENTOS'?'purple':n.status==='DESCARTADO'?'gray':'';
          const fupStr = n.proximoFollowup ? `${n.proximoFollowup.slice(8,10)}/${n.proximoFollowup.slice(5,7)}` : '—';
          const fupWarn = negocioIsStale(n) ? ' ⚠️' : negocioIsDue(n) ? ' 📅' : '';
          return `<tr style="cursor:pointer;" onclick="editNegocio('${n.id}')">
            <td>${date||'—'}</td>
            <td><span class="badge ${stCls}">${escapeHtml(n.status||'—')}</span></td>
            <td>${escapeHtml(n.produto||'')}</td><td>${escapeHtml(n.unidade||'')}</td>
            <td class="truncate" style="max-width:180px;">${escapeHtml(n.cliente1||'')}</td>
            <td>${fmtBRLk(n.vgv)}</td>
            <td><span class="badge gray">${escapeHtml(n.estrutura||'')}</span></td>
            <td>${escapeHtml(n.responsavel||'')}</td>
            <td>${fupStr}${fupWarn}</td>
            <td class="truncate" style="max-width:180px;">${escapeHtml(n.imobiliaria||n.corretor||'')}</td>
            <td onclick="event.stopPropagation()"><button class="btn sm" onclick="showNegocioHistory('${n.id}')">📜</button> <button class="btn sm danger" onclick="deleteNegocio('${n.id}')">×</button></td>
          </tr>`;
        }).join('')}</tbody></table>`;
    }
  }
  render(); window._reloadNegocios = render;
};

function editNegocio(id) {
  const isNew = !id;
  const n = isNew ? { id: uid(), data: todayISO(), status:'INTERESSADOS', estrutura:'PARCERIAS', vgv: 0, criadoPor: CURRENT_USER.email, historico: [], dataUltimaAtualizacao: todayISO() } : DB.negocios.find(x=>x.id===id);
  if (!n) return;
  const isOwner = n.responsavel === CURRENT_USER?.email || n.responsavel === CURRENT_USER?.gpiAssoc;
  if (!isNew && !isAdmin() && !isOwner) return toast('Apenas admin ou responsável podem editar negócios existentes','error');
  
  openModal(`
    <h2>${isNew ? '+ Novo Negócio' : 'Editar Negócio'}</h2>
    <form id="neg-form" class="form">
      <div class="form-row">
        <div><label>Data</label><input type="date" name="data" value="${escapeHtml(n.data||'')}" /></div>
        <div><label>Data de assinatura</label><input type="date" name="dataAssinatura" value="${escapeHtml(n.dataAssinatura||'')}" /></div>
      </div>
      <div class="form-row">
        <div><label>Status / Etapa</label><select name="status" id="neg-status-select">${FUNIL_EXEC.map(s=>`<option ${n.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
        <div><label>Produto</label><select name="produto">${PRODUTOS.map(p=>`<option ${n.produto===p?'selected':''}>${p}</option>`).join('')}</select></div>
      </div>
      <div class="form-row">
        <div><label>Unidade</label><input name="unidade" value="${escapeHtml(n.unidade||'')}" /></div>
        <div><label>VGV (R$)</label><input name="vgv" type="number" step="0.01" value="${n.vgv||0}" /></div>
      </div>
      <div class="form-row">
        <div><label>Cliente — Nome</label><input name="cliente1" value="${escapeHtml(n.cliente1||'')}" /></div>
        <div><label>CPF</label><input name="cpf1" value="${escapeHtml(n.cpf1||'')}" /></div>
      </div>
      <div class="form-row">
        <div><label>Telefone</label><input name="fone1" value="${escapeHtml(n.fone1||'')}" /></div>
        <div><label>Cliente 2 (opcional)</label><input name="cliente2" value="${escapeHtml(n.cliente2||'')}" /></div>
      </div>
      <div class="form-row">
        <div><label>Estrutura</label><select name="estrutura">${ESTRUTURAS.map(e=>`<option ${n.estrutura===e?'selected':''}>${e}</option>`).join('')}</select></div>
        <div><label>Responsável</label><select name="responsavel"><option value="">—</option>${[...DB.gpis, ...DB.executivos].map(r=>`<option ${n.responsavel===r?'selected':''}>${r}</option>`).join('')}</select></div>
      </div>
      <div class="form-row">
        <div>
          <label>Imobiliária</label>
          <input name="imobiliaria" id="neg-imob" value="${escapeHtml(n.imobiliaria||'')}" autocomplete="off"/>
          <div id="neg-imob-list" class="autocomplete-list"></div>
        </div>
        <div><label>Corretor</label><input name="corretor" value="${escapeHtml(n.corretor||'')}" /></div>
      </div>
      <div class="form-row">
        <div><label>Telefone do corretor</label><input name="foneCorretor" value="${escapeHtml(n.foneCorretor||'')}" /></div>
        <div><label>Homologado</label><select name="homologado"><option value="false" ${!n.homologado?'selected':''}>Não</option><option value="true" ${n.homologado?'selected':''}>Sim</option></select></div>
      </div>
      <div><label>Observações</label><textarea name="observacoes">${escapeHtml(n.observacoes||'')}</textarea></div>
      
      <div style="background:var(--bg-card); padding:12px; border-radius:6px; margin-top:16px; border:1px solid var(--border-color);">
        <h3 style="margin-top:0; font-size:14px; margin-bottom:8px;">Follow-up e Interações</h3>
        <div class="form-row">
          <div><label>Próximo Follow-up</label><input type="date" name="proximoFollowup" value="${escapeHtml(n.proximoFollowup||'')}"/></div>
        </div>
        <div>
          <label>Adicionar Interação / Atualização (Histórico)</label>
          <textarea name="novaInteracao" placeholder="O que foi conversado? Resumo da evolução..."></textarea>
        </div>
      </div>

      <div style="display:flex; gap:10px; justify-content: flex-end; margin-top:16px;">
        <button type="button" class="btn" onclick="closeModal()">Cancelar</button>
        <button type="submit" class="btn primary">${isNew ? 'Criar' : 'Salvar'}</button>
      </div>
    </form>
  `);
  setupAutocomplete($('#neg-imob'), $('#neg-imob-list'), DB.imobiliarias.map(i=>i.nome), () => {});
  
  // Sugere proximoFollowup ao mudar status
  $('#neg-status-select').addEventListener('change', e => {
    const s = e.target.value;
    if (s !== 'VENDA' && s !== 'DESCARTADO') {
      const form = $('#neg-form');
      if (!form.proximoFollowup.value) form.proximoFollowup.value = addDaysISO(3);
    }
  });

  $('#neg-form').addEventListener('submit', e => {
    e.preventDefault();
    const fd = new FormData(e.target); const obj = Object.fromEntries(fd.entries());
    obj.vgv = Number(obj.vgv)||0; obj.homologado = obj.homologado === 'true';
    
    // Tratamento de Histórico
    const novaInt = (obj.novaInteracao||'').trim();
    const etapaAntiga = n.status || '—';
    const novaEtapa = obj.status;
    delete obj.novaInteracao; // remove from object assignment

    if (!n.historico) n.historico = [];
    if (isNew) {
      n.historico.push({ data: todayISO(), etapaDe: '—', etapaPara: novaEtapa, obs: novaInt || 'Negócio cadastrado', autor: CURRENT_USER?.email||'' });
      n.dataUltimaAtualizacao = todayISO();
    } else if (etapaAntiga !== novaEtapa || novaInt) {
      n.historico.push({ data: todayISO(), etapaDe: etapaAntiga, etapaPara: novaEtapa, obs: novaInt, autor: CURRENT_USER?.email||'' });
      n.dataUltimaAtualizacao = todayISO();
    }

    Object.assign(n, obj);
    if (n.imobiliaria && !DB.imobiliarias.some(i => i.nome === n.imobiliaria)) {
      DB.imobiliarias.push({ nome: n.imobiliaria, lat:null, lng:null, endereco:'' });
    }
    if (isNew) DB.negocios.push(n);
    saveDB(); closeModal(); toast('Negócio salvo ✓','success');
    if (window._reloadNegocios) _reloadNegocios();
    updateNavBadges();
  });
}

function showNegocioHistory(id) {
  const n = DB.negocios.find(x => x.id === id); if (!n) return;
  const items = (n.historico||[]).slice().reverse().map(h => `
    <div class="h-item" style="padding:12px; border-left:3px solid var(--accent-color); background:var(--bg-card); margin-bottom:8px; border-radius:0 4px 4px 0; border:1px solid var(--border-color); border-left:none;">
      <div style="display:flex; justify-content:space-between; margin-bottom:4px; font-size:12px; color:var(--text-muted);">
        <span><b>${h.data.slice(8,10)}/${h.data.slice(5,7)}</b> · ${escapeHtml(h.autor)}</span>
        <span>${escapeHtml(h.etapaDe)} → <b>${escapeHtml(h.etapaPara)}</b></span>
      </div>
      <div style="font-size:14px;">${escapeHtml(h.obs)}</div>
    </div>`).join('');
  openModal(`<h2>Histórico · ${escapeHtml(n.cliente1||n.imobiliaria||'Negócio')}</h2>
    <div class="lc-meta" style="margin-bottom:12px;">Cadastrado em ${escapeHtml((n.data||'').slice(0,10))} por ${escapeHtml(n.criadoPor||'')}</div>
    <div class="lead-history mt-12" style="max-height:400px; overflow-y:auto;">${items || '<div class="muted">Sem eventos de histórico registrados.</div>'}</div>
    <div class="lc-actions mt-20" style="display:flex; justify-content:flex-end;"><button class="btn" onclick="closeModal()">Fechar</button></div>`);
}

function deleteNegocio(id) {
  if (!isAdmin()) return toast('Apenas admin','error');
  if (!confirm('Excluir este negócio?')) return;
  DB.negocios = DB.negocios.filter(n => n.id !== id);
  saveDB(); if (window._reloadNegocios) _reloadNegocios();
  updateNavBadges();
}

function addImob() {
  const v = $('#add-imob').value.trim(); if (!v) return;
  if (!DB.imobiliarias.some(i => i.nome === v)) DB.imobiliarias.push({ nome: v, lat: null, lng: null, endereco: '' });
  $('#add-imob').value=''; saveDB(); window._reloadImob && _reloadImob();
}
function removeImob(name) {
  if (!isAdmin()) return toast('Apenas admin','error');
  if (!confirm('Remover '+name+'?')) return;
  DB.imobiliarias = DB.imobiliarias.filter(x => x.nome !== name);
  saveDB(); window._reloadImob && _reloadImob();
}
function addCorr() {
  const nome = $('#add-corr-nome').value.trim(); if (!nome) return;
  DB.corretores.push({ nome, fone: $('#add-corr-fone').value.trim(), imobiliaria: $('#add-corr-imob').value.trim() });
  $('#add-corr-nome').value=''; $('#add-corr-fone').value=''; $('#add-corr-imob').value='';
  saveDB(); window._reloadCorr && _reloadCorr();
}
function removeCorr(idx) {
  if (!isAdmin()) return toast('Apenas admin','error');
  DB.corretores.splice(idx,1); saveDB(); window._reloadCorr && _reloadCorr();
}
function addGpi() { const v = $('#add-gpi').value.trim(); if (!v) return; if (!DB.gpis.includes(v)) DB.gpis.push(v); saveDB(); VIEWS.cadastros(); }
function removeGpi(n) { if (!isAdmin()) return; DB.gpis = DB.gpis.filter(x => x !== n); saveDB(); VIEWS.cadastros(); }
function addExec() { const v = $('#add-exec').value.trim(); if (!v) return; if (!DB.executivos.includes(v)) DB.executivos.push(v); saveDB(); VIEWS.cadastros(); }
function removeExec(n) { if (!isAdmin()) return; DB.executivos = DB.executivos.filter(x => x !== n); saveDB(); VIEWS.cadastros(); }

async function testAndInitSupabase() {
  if (!supabaseClient) { toast('SDK Supabase não carregado','error'); return; }
  toast('Testando conexão...','');
  try {
    const { data, error } = await supabaseClient.from('gpi_estado').select('id').eq('id',1).single();
    if (error && error.code === 'PGRST116') {
      // Tabela existe mas sem dados — insere o estado atual
      const { error: e2 } = await supabaseClient.from('gpi_estado').upsert({ id: 1, state_json: DB });
      if (e2) { window._supabaseStatus = { ok: false, msg: e2.message, code: e2.code }; toast('Erro ao inserir: '+e2.message,'error'); }
      else { window._supabaseStatus = { ok: true, msg: 'Estado inicial enviado com sucesso!' }; toast('✅ Supabase conectado e estado enviado!','success'); }
    } else if (error) {
      window._supabaseStatus = { ok: false, msg: error.message, code: error.code };
      toast('❌ Erro: '+error.message,'error');
    } else {
      window._supabaseStatus = { ok: true, msg: 'Tabela encontrada e conexão OK!' };
      toast('✅ Supabase conectado!','success');
    }
  } catch(err) {
    window._supabaseStatus = { ok: false, msg: String(err) };
    toast('Exceção: '+err,'error');
  }
  VIEWS.config();
}

    try {

}

/* ----- AUTOCOMPLETE ----- */
function setupAutocomplete(input, listEl, source, onPick) {
  let hl = -1;
  input.addEventListener('input', () => {
    const q = input.value.toLowerCase().trim();
    if (!q) { listEl.classList.remove('open'); return; }
    const matches = source.filter(x => x.toLowerCase().includes(q)).slice(0, 8);
    if (!matches.length) { listEl.classList.remove('open'); return; }
    listEl.innerHTML = matches.map((m,i) => `<div data-i="${i}">${escapeHtml(m)}</div>`).join('');
    listEl.classList.add('open'); hl = -1;
    listEl.querySelectorAll('div').forEach(d => d.addEventListener('mousedown', e => {
      e.preventDefault(); input.value = d.textContent; listEl.classList.remove('open');
      if (onPick) onPick(d.textContent);
    }));
  });
  input.addEventListener('keydown', e => {
    const items = listEl.querySelectorAll('div');
    if (!items.length) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); hl = (hl+1) % items.length; }
    else if (e.key === 'ArrowUp') { e.preventDefault(); hl = (hl-1+items.length) % items.length; }
    else if (e.key === 'Enter' && hl >= 0) { e.preventDefault(); items[hl].dispatchEvent(new Event('mousedown')); return; }
    else if (e.key === 'Escape') { listEl.classList.remove('open'); return; }
    items.forEach((d,i) => d.classList.toggle('hl', i === hl));
  });
  input.addEventListener('blur', () => setTimeout(()=>listEl.classList.remove('open'), 150));
  input.addEventListener('focus', () => { if (input.value) input.dispatchEvent(new Event('input')); });
}

/* Register Service Worker for PWA with update detection */
let deferredPrompt;
let refreshing = false;
if ('serviceWorker' in navigator) {
  // Evento disparado quando um novo SW assume o controle
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!refreshing) {
      refreshing = true;
      window.location.reload();
    }
  });

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/gpitracker/sw.js')
      .then(reg => {
        console.log('SW Registered');
        // Se houver uma atualização esperando, avisa o usuário (opcional, já que o controllerchange recarrega)
        reg.addEventListener('updatefound', () => {
          const newWorker = reg.installing;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              toast('Atualizando para a nova versão... 🚀', 'info');
            }
          });
        });
      })
      .catch(err => console.error('SW Registration Failed', err));
  });
}

});

  $('#pwa-install-btn').style.display = 'flex';
}

    if (outcome === 'accepted') {
      $('#pwa-install-btn').style.display = 'none';
