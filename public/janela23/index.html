<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <script>
  /* ── VIDEO POPUP ────────────────────────────────── */
  function closeVideoModal() {
    const modal = document.getElementById('modal-video');
    const iframe = document.getElementById('video-iframe');
    modal.classList.remove('fade-in');
    setTimeout(() => {
      modal.classList.remove('show');
      // Stop video when closing
      iframe.src = iframe.src.replace('&autoplay=1', '').replace('&autoplay=1', '');
    }, 400);
  }

  document.addEventListener("DOMContentLoaded", () => {
    if (!localStorage.getItem('janela23_video_seen')) {
      setTimeout(() => {
        const modal = document.getElementById('modal-video');
        const iframe = document.getElementById('video-iframe');
        // Autoplay on show
        if (!iframe.src.includes('autoplay=1')) {
          iframe.src += '&autoplay=1';
        }
        modal.classList.add('show');
        // small delay to allow display:flex to apply before animating opacity
        setTimeout(() => modal.classList.add('fade-in'), 50);
        localStorage.setItem('janela23_video_seen', 'true');
      }, 1500); // Wait 1.5 seconds after page load
    }
  });

</script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:            #111010;
      --bg-2:          #181614;
      --bg-card:       #1C1A18;
      --copper:        #C9906D;
      --copper-light:  #EAC4A8;
      --copper-dark:   #7A4A2E;
      --cg: linear-gradient(90deg, #5C2A1A 0%, #A86040 22%, #D49070 44%, #ECC0A0 55%, #D49070 68%, #A86040 82%, #5C2A1A 100%);
      --white:         #FFFFFF;
      --cream:         #F0EAE2;
      --muted:         #807060;
      --subtle:        #504030;
      --border:        rgba(201,144,109,0.12);
      --border-med:    rgba(201,144,109,0.28);
      --border-strong: rgba(201,144,109,0.5);
    }

    html, body { overflow-x: hidden; width: 100%; max-width: 100vw; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Source Sans 3', sans-serif;
      background: var(--bg);
      color: var(--cream);
      position: relative;
    }

    /* ── UTILITY ─────────────────────────────────── */
    .copper-text {
      background: var(--cg);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .copper-bar {
      height: 2px;
      background: var(--cg);
      width: 100%;
    }

    .copper-bar-thick {
      height: 3px;
      background: var(--cg);
      width: 100%;
    }


    /* ── MONEY ANIMATION ──────────────────────────────────── */
    .money-stage {
      position: relative;
      height: 200px;
      overflow: hidden;
      border: 1px solid var(--border);
      margin-bottom: 28px;
      background: var(--bg-2);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .money-center {
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .money-bag {
      position: absolute;
      font-size: 36px;
      animation: float-bag linear infinite;
      opacity: 0;
      pointer-events: none;
      user-select: none;
    }

    @keyframes float-bag {
      0%   { transform: translateY(220px) rotate(-10deg); opacity: 0; }
      10%  { opacity: .7; }
      80%  { opacity: .5; }
      100% { transform: translateY(-60px) rotate(10deg); opacity: 0; }
    }

    /* ── R$1M SECTION ─────────────────────────────────────── */
    #premio-total {
      position: relative;
      padding: 90px 28px;
      overflow: hidden;
      text-align: center;
      background: var(--bg-2);
    }

    #premio-total::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 60% at 50% 50%, rgba(201,144,109,.07) 0%, transparent 70%);
    }

    .premio-frame {
      position: relative;
      z-index: 2;
      max-width: 700px;
      margin: 0 auto 52px;
      border: 1px solid var(--border-strong);
      padding: 52px 40px;
    }

    .premio-frame::before, .premio-frame::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      height: 3px;
      background: var(--cg);
    }
    .premio-frame::before { top: 0; }
    .premio-frame::after  { bottom: 0; }

    .premio-value {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(20px, 3.5vw, 32px);
      font-weight: 700;
      letter-spacing: .05em;
      margin-bottom: 4px;
    }

    .premio-label {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(36px, 7vw, 72px);
      font-weight: 900;
      text-transform: uppercase;
      line-height: 1;
      color: var(--white);
      margin-bottom: 28px;
    }

    .premio-meta-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .4em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .premio-meta-value {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(18px, 3vw, 28px);
      font-weight: 700;
      color: var(--subtle);
      letter-spacing: .02em;
    }

    .premio-desc {
      position: relative;
      z-index: 2;
      max-width: 580px;
      margin: 0 auto 44px;
      font-size: 17px;
      font-weight: 300;
      color: var(--muted);
      line-height: 1.85;
    }

    .premio-slogan {
      position: relative;
      z-index: 2;
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(18px, 3.5vw, 32px);
      font-weight: 900;
      text-transform: uppercase;
      line-height: 1.3;
      letter-spacing: .02em;
    }

    .premio-slogan .dim  { color: var(--muted); }
    .premio-slogan .gold { background: var(--cg); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }



    /* ── DINHEIRO SAINDO DO FRAME ─────────────────────────── */
    .money-stage {
      overflow: visible !important;
    }

    .campaigns-grid {
      overflow: visible;
    }

    .camp-card.money-card {
      overflow: visible;
    }

    .money-bag-out {
      position: absolute;
      font-size: 52px;
      animation: float-bag-out linear infinite;
      opacity: 0;
      pointer-events: none;
      user-select: none;
      z-index: 10;
      filter: drop-shadow(0 4px 12px rgba(201,144,109,.35));
    }

    @keyframes float-bag-out {
      0%   { transform: translateY(80px) scale(0.7) rotate(-15deg); opacity: 0; }
      12%  { opacity: 1; }
      75%  { opacity: .85; }
      100% { transform: translateY(-120px) scale(1.1) rotate(10deg); opacity: 0; }
    }

    /* R$1M section — dinheiro saindo do frame */
    #premio-total {
      overflow: visible;
    }

    .premio-frame {
      overflow: visible;
    }

    .money-fly {
      position: absolute;
      font-size: 60px;
      animation: money-fly-up ease-in-out infinite;
      opacity: 0;
      pointer-events: none;
      user-select: none;
      filter: drop-shadow(0 6px 16px rgba(201,144,109,.4));
    }

    @keyframes money-fly-up {
      0%   { transform: translateY(40px) scale(.8) rotate(-8deg); opacity: 0; }
      15%  { opacity: 1; }
      70%  { opacity: .9; }
      100% { transform: translateY(-160px) scale(1.2) rotate(12deg); opacity: 0; }
    }

    /* ── SCOOTER HERO ─────────────────────────────────────── */
    .scooter-hero {
      position: relative;
      overflow: visible;
      margin: -52px -44px 0px;
      background: #000;
      min-height: 300px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .scooter-hero img {
      width: 95%;
      height: auto;
      display: block;
      transition: transform .8s ease;
      position: relative;
      z-index: 2;
      margin: 0 auto;
      mix-blend-mode: lighten;
    }

    .camp-card:hover .scooter-hero img {
      transform: scale(1.05) translateY(-8px);
    }

    /* Gradiente inferior suave fundindo com o card */
    .scooter-hero::after {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 80px;
      background: linear-gradient(to top, var(--bg-card) 0%, transparent 100%);
      pointer-events: none;
      z-index: 3;
    }

    /* Brilho copper sob a scooter */
    .scooter-hero::before {
      content: '';
      position: absolute;
      bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 70%;
      height: 60px;
      background: radial-gradient(ellipse at center bottom, rgba(201,144,109,.18) 0%, transparent 70%);
      z-index: 1;
    }

    /* Badge de prêmio sobreposto */
    .scooter-badge {
      position: absolute;
      top: 20px; left: 20px;
      z-index: 2;
      background: var(--cg);
      font-family: 'Montserrat', sans-serif;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .45em;
      text-transform: uppercase;
      color: #fff;
      padding: 7px 16px;
    }

    /* Nome do prêmio sobreposto na parte de baixo da imagem */
    .scooter-title-overlay {
      position: absolute;
      bottom: 20px; left: 24px; right: 24px;
      z-index: 2;
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(28px, 4vw, 40px);
      font-weight: 900;
      text-transform: uppercase;
      line-height: 1.0;
      letter-spacing: .02em;
      color: #fff;
      text-shadow: 0 2px 20px rgba(0,0,0,.5);
    }

    .scooter-title-overlay span {
      background: var(--cg);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── REVEAL ON SCROLL ─────────────────────────── */
    .r { opacity: 0; transform: translateY(36px); transition: opacity .85s ease, transform .85s ease; }
    .r.on { opacity: 1; transform: translateY(0); }
    .r.d1 { transition-delay: .1s; }
    .r.d2 { transition-delay: .2s; }
    .r.d3 { transition-delay: .3s; }
    .r.d4 { transition-delay: .4s; }
    .r.d5 { transition-delay: .5s; }

    /* ══════════════════════════════════════════════ */
    /*  TICKER                                        */
    /* ══════════════════════════════════════════════ */
    .ticker-wrap {
      background: var(--bg-2);
      border-bottom: 1px solid var(--border);
      overflow: hidden;
      height: 38px;
      display: flex;
      align-items: center;
    }

    .ticker-track {
      display: flex;
      gap: 0;
      animation: ticker-scroll 28s linear infinite;
      white-space: nowrap;
    }

    .ticker-item {
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: var(--copper);
      padding: 0 40px;
    }

    .ticker-dot {
      color: var(--subtle);
      padding: 0 4px;
    }

    @keyframes ticker-scroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    /* ══════════════════════════════════════════════ */
    /*  HERO                                          */
    /* ══════════════════════════════════════════════ */
    #hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 24px 100px;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background-image: url('assets/bg.jpg');
      background-size: cover;
      background-position: center;
      opacity: .55;
    }

    .hero-glow {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 40%, rgba(201,144,109,.07) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 50% 80%, rgba(90,40,20,.4) 0%, transparent 70%);
      animation: glow-pulse 5s ease-in-out infinite;
    }

    @keyframes glow-pulse {
      0%,100% { opacity: .7; }
      50%      { opacity: 1; }
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 960px;
      width: 100%;
    }

    .hero-eyebrow {
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .55em;
      text-transform: uppercase;
      color: var(--copper);
      margin-bottom: 36px;
      animation: fadeUp .9s ease-out .2s both;
    }

    .hero-logo {
      width: min(460px, 78vw);
      margin-bottom: 36px;
      animation: fadeUp .9s ease-out .4s both;
      filter: drop-shadow(0 0 40px rgba(201,144,109,.15));
    }

    .hero-tagline {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(28px, 5.5vw, 68px);
      font-weight: 800;
      text-transform: uppercase;
      line-height: 1.05;
      letter-spacing: -.01em;
      margin-bottom: 28px;
      animation: fadeUp .9s ease-out .6s both;
    }

    .hero-sub {
      font-size: 15px;
      font-weight: 300;
      letter-spacing: .25em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 56px;
      animation: fadeUp .9s ease-out .75s both;
    }

    /* Countdown */
    .countdown {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 8px;
      margin-bottom: 52px;
      animation: fadeUp .9s ease-out .9s both;
    }

    .cd-block {
      text-align: center;
      min-width: 80px;
    }

    .cd-num {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(40px, 7vw, 72px);
      font-weight: 800;
      line-height: 1;
      background: var(--cg);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: block;
      transition: all .3s;
    }

    .cd-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .35em;
      text-transform: uppercase;
      color: var(--subtle);
      margin-top: 8px;
      display: block;
    }

    .cd-sep {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(32px, 5vw, 56px);
      font-weight: 200;
      color: var(--copper-dark);
      padding-top: 2px;
      line-height: 1;
      align-self: flex-start;
    }

    .hero-cta {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      background: var(--cg);
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .4em;
      text-transform: uppercase;
      padding: 16px 40px;
      border: none;
      cursor: default;
      animation: fadeUp .9s ease-out 1.1s both;
    }

    .hero-dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,.5); }

    .hero-scroll {
      position: absolute;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      animation: arrow-bounce 2s ease-in-out infinite;
    }

    .hero-scroll svg {
      width: 22px;
      height: 22px;
      stroke: var(--copper);
      opacity: .5;
    }

    @keyframes arrow-bounce {
      0%,100% { transform: translateX(-50%) translateY(0); }
      50%      { transform: translateX(-50%) translateY(9px); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ══════════════════════════════════════════════ */
    /*  INTRO SECTION                                 */
    /* ══════════════════════════════════════════════ */
    #intro {
      max-width: 1260px;
      margin: 0 auto;
      padding: 100px 28px;
      text-align: center;
    }

    .eyebrow {
      font-family: 'Montserrat', sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .55em;
      text-transform: uppercase;
      color: var(--copper);
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .eyebrow::before, .eyebrow::after {
      content: '';
      width: 60px;
      height: 1px;
      background: var(--border-med);
      flex-shrink: 0;
    }

    .section-title {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(26px, 4.5vw, 52px);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .02em;
      line-height: 1.1;
      margin-bottom: 20px;
    }

    .section-lead {
      font-size: 17px;
      font-weight: 300;
      color: var(--muted);
      line-height: 1.85;
      max-width: 640px;
      margin: 0 auto 64px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
    }

    .stat-card {
      background: var(--bg-2);
      padding: 52px 32px;
      transition: background .3s;
    }

    .stat-card:hover { background: var(--bg-card); }

    .stat-icon {
      font-size: 28px;
      margin-bottom: 20px;
      display: block;
    }

    .stat-num {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(36px, 5vw, 56px);
      font-weight: 900;
      line-height: 1;
      margin-bottom: 10px;
      display: block;
    }

    .stat-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .35em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ══════════════════════════════════════════════ */
    /*  CAMPAIGNS                                     */
    /* ══════════════════════════════════════════════ */
    #campanhas {
      max-width: 1260px;
      margin: 0 auto;
      padding: 80px 28px 100px;
      text-align: center;
    }

    .campaigns-grid {
      display: grid;
      grid-template-columns: 1fr;
      max-width: 720px;
      margin: 0 auto;
      gap: 28px;
    }

    .camp-card {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 52px 44px;
      overflow: hidden;
      transition: border-color .4s, transform .4s;
    }

    .camp-card.scooter-card {
      padding-top: 0;
    }

    .camp-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--cg);
    }

    .camp-card:hover {
      border-color: var(--border-med);
      transform: translateY(-5px);
    }

    .camp-bg-text {
      position: absolute;
      bottom: -16px; right: -10px;
      font-family: 'Montserrat', sans-serif;
      font-size: 110px;
      font-weight: 900;
      color: rgba(201,144,109,.04);
      line-height: 1;
      user-select: none;
      pointer-events: none;
    }

    .camp-img {
      width: 100%;
      height: auto;
      display: block;
      margin-bottom: 28px;
      border: 1px solid var(--border);
    }

    .camp-trigger {
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .3em;
      text-transform: uppercase;
      color: var(--copper);
      margin-bottom: 14px;
    }

    .camp-reward {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(22px, 3.5vw, 38px);
      font-weight: 900;
      text-transform: uppercase;
      line-height: 1.05;
      margin-bottom: 18px;
    }

    .camp-desc {
      font-size: 15px;
      font-weight: 300;
      color: var(--muted);
      line-height: 1.75;
    }

    /* ══════════════════════════════════════════════ */
    /*  BRAND HEADER                                  */
    /* ══════════════════════════════════════════════ */
    .brand-section {
      max-width: 1260px;
      margin: 0 auto;
      padding: 80px 28px 0;
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 28px;
      padding-bottom: 40px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 56px;
    }

    .brand-pill {
      font-family: 'Montserrat', sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .5em;
      text-transform: uppercase;
      color: var(--copper);
      border: 1px solid var(--border-strong);
      padding: 10px 22px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .brand-title {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(28px, 4.5vw, 52px);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    /* ══════════════════════════════════════════════ */
    /*  PRODUCT BLOCK                                 */
    /* ══════════════════════════════════════════════ */
    .product-block {
      max-width: 1260px;
      margin: 0 auto;
      padding: 0 28px 80px;
    }

    .product-header {
      display: flex;
      align-items: baseline;
      gap: 20px;
      margin-bottom: 36px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--border);
    }

    .product-name {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(22px, 4vw, 44px);
      font-weight: 800;
      text-transform: uppercase;

        /* ── VENDIDO STAMP (Premium Glass & Silver Cannon) ────── */

    .stamp-premium {
      background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.0));
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      border-radius: 8px;
      padding: 16px 40px;
      position: relative;
      transform: scale(0.5) translateY(-50px) rotate(-5deg);
      opacity: 0;
    }
    .stamp-premium::before {
      content: '';
      position: absolute;
      top: 0; left: -100%; width: 50%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
      transform: skewX(-20deg);
    }
    .stamp-premium span {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(32px, 5vw, 48px);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      background: linear-gradient(to right, #e2e8f0, #ffffff, #94a3b8, #ffffff);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,0.8));
    }
    .r.on .stamp-premium {
      animation: stamp-appear 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    .r.on .stamp-premium::before {
      animation: light-sweep-glass 2s ease-in-out 1s infinite;
    }
    .r.on .stamp-premium span {
      animation: text-shine 3s linear infinite;
    }

    @keyframes stamp-appear {
      0% { transform: scale(0.5) translateY(-50px) rotate(-15deg); opacity: 0; }
      100% { transform: scale(1) translateY(0) rotate(-5deg); opacity: 1; }
    }
    @keyframes light-sweep-glass {

      100% { left: 200%; }

    @keyframes text-shine {

    @keyframes cannon-blast {
      0% { 
        transform: translate(0, 0) rotate3d(1, 1, 1, 0deg);

      30% { 
        transform: translate(calc(var(--tx) * 0.8), calc(var(--ty) * 0.8)) rotate3d(1, 1, 1, calc(var(--rot) / 2)); 
        opacity: 1; 
      }
      100% { 
        transform: translate(var(--tx), calc(var(--ty) + 200px)) rotate3d(1, 1, 1, var(--rot)); 
        opacity: 0; 
      }
    }
      100% { transform: scale(1.3); opacity: 0; border-width: 0px; }
